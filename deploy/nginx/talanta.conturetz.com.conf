# Host Nginx site: /etc/nginx/sites-available/talanta.conturetz.com
# Talanta runs in Docker (/var/www/talanta-docker); the frontend container listens on 127.0.0.1:8095.
server {
    server_name talanta.conturetz.com www.talanta.conturetz.com;
    server_tokens off;

    access_log /var/log/nginx/talanta.access.log;
    error_log  /var/log/nginx/talanta.error.log warn;

    client_max_body_size 32M;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/talanta.conturetz.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/talanta.conturetz.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name talanta.conturetz.com www.talanta.conturetz.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
